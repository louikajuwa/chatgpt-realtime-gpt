<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Realtime Voice Brain</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Crect x='13' y='7' width='6' height='12' rx='3' fill='white'/%3E%3Cpath d='M9 15a7 7 0 0 0 14 0M16 22v4' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#micButton">Skip to microphone</a>

  <header class="app-header">
    <h1 class="app-title"><span aria-hidden="true">&#129504;</span> Realtime Voice Brain</h1>
    <div class="header-status">
      <span id="statusPill" class="pill pill-connecting" role="status">
        <span class="pill-dot" aria-hidden="true"></span>
        <span id="statusText">Connecting</span>
      </span>
      <button id="reconnectBtn" class="btn btn-secondary btn-sm" type="button" hidden>Reconnect</button>
    </div>
  </header>

  <div id="banner" class="banner banner-error" role="alert" hidden></div>

  <div id="busyBox" class="banner banner-warn" hidden>
    <span id="busyText">The server is busy. Please try again shortly.</span>
    <button id="retryBtn" class="btn btn-secondary btn-sm" type="button">Retry</button>
  </div>

  <section id="authPanel" class="card auth-card" aria-labelledby="authHeading" hidden>
    <h2 id="authHeading" class="card-title">Access token required</h2>
    <form id="authForm" class="auth-form" autocomplete="off">
      <label class="field-label" for="tokenInput">Access token</label>
      <input id="tokenInput" class="input" type="password" autocomplete="off" spellcheck="false" required />
      <p id="authError" class="field-error" role="alert" hidden></p>
      <button class="btn btn-primary" type="submit">Connect</button>
    </form>
  </section>

  <main id="appMain" class="layout">
    <section class="card brain-panel" aria-labelledby="brainHeading">
      <h2 id="brainHeading" class="card-title"><span aria-hidden="true">&#129516;</span> Brain Memory</h2>
      <label class="field-label" for="brainInput">Instructions and facts the assistant should remember</label>
      <textarea id="brainInput" class="input brain-input" placeholder="Enter or update your brain content here..." spellcheck="true"></textarea>
      <div class="brain-meta">
        <span id="brainCount" class="counter">0 / 0</span>
        <span class="hint">Ctrl/Cmd+S to save</span>
      </div>
      <div class="btn-row">
        <button id="saveBrain" class="btn btn-primary" type="button" disabled>Save</button>
        <button id="loadBrain" class="btn btn-secondary" type="button" disabled>Load</button>
      </div>
    </section>

    <section class="card chat-panel" aria-labelledby="chatHeading">
      <div class="chat-head">
        <h2 id="chatHeading" class="card-title">Conversation</h2>
        <button id="clearBtn" class="btn btn-ghost btn-sm" type="button">Clear</button>
      </div>

      <div id="transcript" class="transcript" role="log" aria-live="polite" aria-relevant="additions text" tabindex="0" aria-label="Conversation transcript">
        <p id="emptyState" class="empty-state"><span aria-hidden="true">&#127911;</span> Press &ldquo;Start talking&rdquo; and speak to begin.</p>
      </div>

      <div class="mic-bar">
        <button id="micButton" class="btn btn-mic" type="button" aria-pressed="false" disabled>
          <span id="micDot" class="mic-dot" aria-hidden="true"></span>
          <span id="micLabel">Start talking</span>
        </button>
        <button id="stopReply" class="btn btn-danger" type="button" hidden>Stop reply</button>
        <p id="micHint" class="hint mic-hint"></p>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
